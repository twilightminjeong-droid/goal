<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Golf Swing Coach & Tracer</title>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-main: #090d16;
      --panel-bg: #131b2e;
      --card-bg: rgba(26, 38, 64, 0.7);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --cyan: #06b6d4;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 헤더 & 스코어 배지 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand h1 span { color: var(--accent); }
    .brand p { font-size: 0.72rem; color: var(--text-muted); }
    .score-badge {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid var(--accent);
      padding: 5px 12px;
      border-radius: 20px;
      text-align: right;
    }
    .score-badge .score-val {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent);
    }
    .score-badge .score-label {
      font-size: 0.62rem;
      color: var(--text-muted);
    }

    /* 비디오 & 트레이서 뷰포트 */
    .video-viewport {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 330px;
      max-height: 520px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    video {
      width: 100%;
      max-height: 520px;
      display: none;
      object-fit: contain;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .placeholder-box {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 40px 15px;
      line-height: 1.6;
    }

    /* 구질 선택 및 트레이서 런처 바 */
    .tracer-bar {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tracer-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tracer-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .tracer-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .tracer-btn[data-shot="straight"].active {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #fff;
    }
    .tracer-btn[data-shot="draw"].active {
      background: rgba(6, 182, 212, 0.15);
      border-color: #06b6d4;
      color: #fff;
    }
    .tracer-btn[data-shot="fade"].active {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fff;
    }
    .tracer-btn[data-shot="slice"].active {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fff;
    }
    .launch-btn {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #000;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s;
    }
    .launch-btn:active { transform: scale(0.96); }

    /* 9단계 타임라인 스트립 */
    .timeline-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-title {
      font-size: 0.78rem;
      font-weight: 700
