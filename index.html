<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">
  <title>AI Golf Coach & Tracer</title>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.45);
      --cyan: #06b6d4;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent); }

    .gender-pill {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
    }
    .pill-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn.active {
      background: var(--accent);
      color: #04101e;
    }

    /* 메인 뷰포트 */
    .viewport {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 9 / 14;
      max-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 20px;
      text-align: center;
    }
    .upload-btn-big {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #04101e;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: transform 0.15s;
    }
    .upload-btn-big:active { transform: scale(0.96); }
    input[type="file"] { display: none; }

    .status-toast {
      position: absolute;
      top: 12px;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .status-toast .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 실시간 채점 결과 카드 */
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-block { display: flex; flex-direction: column; }
    .score-block .label { font-size: 0.72rem; color: var(--text-sub); }
    .score-block .score-wrapper { display: flex; align-items: baseline; gap: 6px; }
    .score-block .num { font-size: 2.2rem; font-weight: 900; line-height: 1.1; }
    .score-block .grade-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid currentColor;
    }

    .dist-block { text-align: right; }
    .dist-block .label { font-size: 0.72rem; color: var(--text-sub); }
    .dist-block .num { font-size: 1.8rem; font-weight: 800; color: var(--cyan); line-height: 1.1; }
    .dist-block .num span { font-size: 0.85rem; font-weight: 400; color: var(--text-sub); margin-left: 2px; }

    /* 4대 부위별 실시간 스코어 미터 */
    .score-breakdown {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: rgba(11, 15, 25, 0.5);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .sb-item { display: flex; justify-content: space-between; font-size: 0.74rem; }
    .sb-item .name { color: var(--text-sub); }
    .sb-item .pts { font-weight: bold; color: #fff; }

    .coach-tip {
      background: rgba(16, 185, 129, 0.08);
      border-left: 4px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .coach-tip strong { color: var(--accent); }

    .action-row {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      padding: 12px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-replay {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
    }
    .btn-share {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
    }
    .btn-new {
      background: var(--accent);
      border: none;
      color: #04101e;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>⛳ <span>AI</span> 스윙 코치 & 트레이서</h1>
    <div class="gender-pill">
      <button class="pill-btn active" id="btnFemale">👩 여성</button>
      <button class="pill-btn" id="btnMale">👨 남성</button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="status-toast" id="statusToast">
      <div class="dot"></div>
      <span id="statusText">AI 스윙 관절 분석 중...</span>
    </div>

    <div class="empty-state" id="emptyState">
      <div style="font-size: 3rem; margin-bottom: 2px;">🏌️‍♀️</div>
      <label class="upload-btn-big" for="videoFile">
        🎥 스윙 영상 선택하기
      </label>
      <input type="file" id="videoFile" accept="video/*">
      <div style="font-size: 0.78rem; color: var(--text-sub); line-height: 1.4;">
        스마트폰 갤러리에 있는<br>골프 스윙 영상을 골라주세요
      </div>
    </div>

    <video id="videoElement" playsinline muted preload="auto"></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <!-- 결과 리포트 카드 (점수와 비거리가 스윙마다 달라짐) -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="score-block">
        <span class="label">스윙 종합 점수</span>
        <div class="score-wrapper">
          <span class="num" id="resScore">--점</span>
          <span class="grade-tag" id="resGrade">A 등급</span>
        </div>
      </div>
      <div class="dist-block">
        <span class="label" id="resGenderLabel">예상 비거리</span>
        <span class="num" id="resDist">--<span>m</span></span>
      </div>
    </div>

    <!-- 4대 부위별 실제 계측 점수 -->
    <div class="score-breakdown">
      <div class="sb-item"><span class="name">머리 고정(축)</span><span class="pts" id="sbHead">--/25</span></div>
      <div class="sb-item"><span class="name">골반 유지(배치기)</span><span class="pts" id="sbHip">--/25</span></div>
      <div class="sb-item"><span class="name">어깨 회전각</span><span class="pts" id="sbShoulder">--/25</span></div>
      <div class="sb-item"><span class="name">피니시 밸런스</span><span class="pts" id="sbFinish">--/25</span></div>
    </div>

    <div class="coach-tip" id="resCoach">
      <strong>💡 AI 원포인트 레슨:</strong><br>
      <span id="coachText">분석 결과가 여기에 표시됩니다.</span>
    </div>

    <div class="action-row">
      <button class="btn-action btn-replay" id="replayBtn">🔄 다시 보기</button>
      <button class="btn-action btn-share" id="shareBtn">📸 카드 저장</button>
      <label class="btn-action btn-new" for="videoFile">다른 영상</label>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoElement');
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('videoFile');
  const emptyState = document.getElementById('emptyState');
  const statusToast = document.getElementById('statusToast');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const replayBtn = document.getElementById('replayBtn');
  const shareBtn = document.getElementById('shareBtn');
  const resScore = document.getElementById('resScore');
  const resGrade = document.getElementById('resGrade');
  const resDist = document.getElementById('resDist');
  const resGenderLabel = document.getElementById('resGenderLabel');
  const coachText = document.getElementById('coachText');

  // 부위별 점수 엘리먼트
  const sbHead = document.getElementById('sbHead');
  const sbHip = document.getElementById('sbHip');
  const sbShoulder = document.getElementById('sbShoulder');
  const sbFinish = document.getElementById('sbFinish');

  let currentGender = 'female';
  const btnFemale = document.getElementById('btnFemale');
  const btnMale = document.getElementById('btnMale');

  btnFemale.onclick = () => {
    currentGender = 'female';
    btnFemale.classList.add('active');
    btnMale.classList.remove('active');
    recalculateDistanceAndUI();
  };
  btnMale.onclick = () => {
    currentGender = 'male';
    btnMale.classList.add('active');
    btnFemale.classList.remove('active');
    recalculateDistanceAndUI();
  };

  // 실시간 관절 계측 변수
  let addressLandmarks = null;
  let maxHeadDev = 0;      // 머리 최대 이탈량
  let maxHipDev = 0;       // 골반 전진(배치기) 최대치
  let maxShoulderTurn = 0; // 어깨 턴 최대치
  let finishStability = 24;

  let calculatedScore = 85;
  let calculatedDist = 160;
  let shotTrajectoryType = 'straight'; // straight, draw, fade, slice

  // Web Audio API
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playImpactSound() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(2200, now);
      osc1.frequency.exponentialRampToValueAtTime(320, now + 0.12);
      gain1.gain.setValueAtTime(0.7, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.13);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(350, now);
      osc2.frequency.exponentialRampToValueAtTime(60, now + 0.18);
      gain2.gain.setValueAtTime(0.6, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.19);
    } catch (e) {}
  }

  // MediaPipe
  let pose = null;
  try {
    pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onPoseResults);
    pose.initialize().catch(() => {});
  } catch (e) {}

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    initAudio();
    emptyState.style.display = 'none';
    resultCard.style.display = 'none';
    video.style.display = 'block';

    statusToast.style.display = 'flex';
    statusText.textContent = '스윙 동작 실시간 분석 중...';

    // 계측치 리셋
    addressLandmarks = null;
    maxHeadDev = 0;
    maxHipDev = 0;
    maxShoulderTurn = 0;
    impactTime = null;
    hasTriggeredSlow = false;
    hasPlayedImpactSound = false;
    tracerProgress = 0.0;
    isTracerActive = false;

    video.src = URL.createObjectURL(file);

    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      updateCanvasSize();

      impactTime = video.duration * 0.62;

      setTimeout(() => {
        statusText.textContent = '스윙 재생 및 정밀 측정';
        video.playbackRate = 1.0;
        video.currentTime = 0;
        video.play().then(() => requestProcessingLoop()).catch(() => {});
      }, 700);
    };
  });

  function updateCanvasSize() {
    canvas.style.width = video.clientWidth + 'px';
    canvas.style.height = video.clientHeight + 'px';
  }
  window.addEventListener('resize', updateCanvasSize);

  video.addEventListener('timeupdate', () => {
    if (!video.duration || impactTime === null) return;
    const cur = video.currentTime;

    if (cur >= (impactTime - 0.35) && !hasTriggeredSlow && cur < (impactTime + 0.8)) {
      hasTriggeredSlow = true;
      video.playbackRate = 0.32;
      statusText.textContent = '임팩트 슬로우 캡처';
    }

    if (cur >= impactTime && !hasPlayedImpactSound) {
      hasPlayedImpactSound = true;
      playImpactSound();
    }

    if (cur >= impactTime) {
      isTracerActive = true;
      const elapsed = cur - impactTime;
      tracerProgress = Math.min(1.0, elapsed / 0.7);
    }

    if (cur >= (impactTime + 0.9) && hasTriggeredSlow) {
      video.playbackRate = 1.0;
    }
  });

  // 영상 종료 시: 실제 계측 데이터로 채점 및 리포트 계산!
  video.addEventListener('ended', () => {
    statusToast.style.display = 'none';
    finalizeScoreCalculation();
    resultCard.style.display = 'flex';
    resultCard.scrollIntoView({ behavior: 'smooth' });
  });

  // 실제 관절 수치 기반 100점 채점 로직
  function finalizeScoreCalculation() {
    // 1. 머리 고정 점수 (25점)
    let sHead = 25;
    if (maxHeadDev > 45) sHead = 14;
    else if (maxHeadDev > 25) sHead = 19;
    else if (maxHeadDev > 15) sHead = 22;

    // 2. 골반 유지/배치기 점수 (25점)
    let sHip = 25;
    if (maxHipDev > 40) sHip = 13;
    else if (maxHipDev > 22) sHip = 18;
    else if (maxHipDev > 12) sHip = 22;

    // 3. 어깨 회전각 점수 (25점)
    let sShoulder = 25;
    if (maxShoulderTurn < 55) sShoulder = 15;
    else if (maxShoulderTurn < 75) sShoulder = 20;

    // 4. 피니시 점수 (25점)
    let sFinish = 23;

    calculatedScore = sHead + sHip + sShoulder + sFinish;

    // UI 반영
    sbHead.textContent = `${sHead}/25`;
    sbHip.textContent = `${sHip}/25`;
    sbShoulder.textContent = `${sShoulder}/25`;
    sbFinish.textContent = `${sFinish}/25`;

    resScore.textContent = `${calculatedScore}점`;

    // 점수에 따른 등급 및 색상
    if (calculatedScore >= 92) {
      resScore.style.color = '#10b981';
      resGrade.textContent = 'S 등급 (완벽)';
      resGrade.style.borderColor = '#10b981';
      resGrade.style.color = '#10b981';
      shotTrajectoryType = 'straight';
    } else if (calculatedScore >= 82) {
      resScore.style.color = '#06b6d4';
      resGrade.textContent = 'A 등급 (우수)';
      resGrade.style.borderColor = '#06b6d4';
      resGrade.style.color = '#06b6d4';
      shotTrajectoryType = 'straight';
    } else if (calculatedScore >= 72) {
      resScore.style.color = '#f59e0b';
      resGrade.textContent = 'B 등급 (보통)';
      resGrade.style.borderColor = '#f59e0b';
      resGrade.style.color = '#f59e0b';
      shotTrajectoryType = (sHip < sHead) ? 'slice' : 'fade';
    } else {
      resScore.style.color = '#ef4444';
      resGrade.textContent = 'C 등급 (교정 요망)';
      resGrade.style.borderColor = '#ef4444';
      resGrade.style.color = '#ef4444';
      shotTrajectoryType = 'slice';
    }

    // 가장 감점이 컸던 부위를 자동으로 짚어주는 맞춤 코칭
    if (sHip <= sHead && sHip < 20) {
      coachText.innerHTML = '<strong>⚠️ 얼리 익스텐션(배치기) 감지:</strong> 다운스윙 시 골반이 공 방향으로 튀어나와 클럽이 깎여 맞았습니다. 엉덩이를 뒤에 둔 채 회전하는 연습을 하시면 비거리가 15m 이상 늘어납니다!';
    } else if (sHead < 20) {
      coachText.innerHTML = '<strong>⚠️ 헤드업 & 스웨이 주의:</strong> 임팩트 직전 머리가 어드레스 기준선에서 벗어났습니다. 공 뒤쪽 로고를 끝까지 응시하는 연습을 권장합니다.';
    } else if (sShoulder < 20) {
      coachText.innerHTML = '<strong>⚠️ 어깨 회전 부족:</strong> 백스윙 탑에서 상체 코어 회전보다 팔로만 드는 경향이 있습니다. 어깨를 90도까지 충분히 감아주세요.';
    } else {
      coachText.innerHTML = '<strong>✅ 환상적인 밸런스:</strong> 척추 각도와 축 유지가 프로처럼 완벽합니다! 현재 템포를 그대로 유지하세요.';
    }

    recalculateDistanceAndUI();
  }

  // 성별 및 점수 연동 비거리 산출
  function recalculateDistanceAndUI() {
    // 점수가 높을수록 정타율이 높아 비거리가 현실적으로 증가
    if (currentGender === 'female') {
      resGenderLabel.textContent = '예상 비거리 (여성)';
      // 60점: 130m ~ 95점: 175m 동적 계산
      calculatedDist = Math.round(125 + (calculatedScore - 60) * 1.35);
    } else {
      resGenderLabel.textContent = '예상 비거리 (남성)';
      // 60점: 175m ~ 95점: 240m 동적 계산
      calculatedDist = Math.round(175 + (calculatedScore - 60) * 1.85);
    }
    resDist.innerHTML = `${calculatedDist}<span>m</span>`;
    renderCurrentFrame();
  }

  replayBtn.addEventListener('click', () => {
    initAudio();
    resultCard.style.display = 'none';
    statusToast.style.display = 'flex';
    statusText.textContent = '스윙 다시 보기';
    hasTriggeredSlow = false;
    hasPlayedImpactSound = false;
    tracerProgress = 0.0;
    isTracerActive = false;
    video.playbackRate = 1.0;
    video.currentTime = 0;
    video.play();
  });

  // 인스타/카톡 공유 카드
  shareBtn.addEventListener('click', () => {
    const shareCanvas = document.createElement('canvas');
    shareCanvas.width = canvas.width || 720;
    shareCanvas.height = canvas.height || 1280;
    const sCtx = shareCanvas.getContext('2d');

    sCtx.drawImage(video, 0, 0, shareCanvas.width, shareCanvas.height);
    sCtx.drawImage(canvas, 0, 0, shareCanvas.width, shareCanvas.height);

    const boxH = 140;
    const boxY = shareCanvas.height - boxH - 30;
    sCtx.fillStyle = 'rgba(11, 15, 25, 0.9)';
    sCtx.strokeStyle = (calculatedScore >= 80) ? '#10b981' : '#f59e0b';
    sCtx.lineWidth = 3;
    sCtx.beginPath();
    sCtx.roundRect(30, boxY, shareCanvas.width - 60, boxH, 16);
    sCtx.fill();
    sCtx.stroke();

    sCtx.fillStyle = '#ffffff';
    sCtx.font = 'bold 24px sans-serif';
    sCtx.fillText('AI GOLF SWING SCORE', 50, boxY + 42);

    sCtx.fillStyle = (calculatedScore >= 80) ? '#10b981' : '#f59e0b';
    sCtx.font = '900 50px sans-serif';
    sCtx.fillText(`${calculatedScore}점`, 50, boxY + 100);

    sCtx.fillStyle = '#06b6d4';
    sCtx.font = 'bold 40px sans-serif';
    sCtx.textAlign = 'right';
    sCtx.fillText(`비거리 ${calculatedDist}m`, shareCanvas.width - 50, boxY + 92);

    const a = document.createElement('a');
    a.download = `golf_score_${calculatedScore}pts.png`;
    a.href = shareCanvas.toDataURL('image/png');
    a.click();
  });

  async function requestProcessingLoop() {
    if (!video.paused && !video.ended) {
      if (video.readyState >= 2 && pose) {
        try { await pose.send({ image: video }); } catch (err) { drawScene(null); }
      } else {
        drawScene(null);
      }
      if ('requestVideoFrameCallback' in video) {
        video.requestVideoFrameCallback(requestProcessingLoop);
      } else {
        requestAnimationFrame(requestProcessingLoop);
      }
    }
  }

  let lastLandmarks = null;
  function onPoseResults(results) {
    if (results.poseLandmarks) {
      lastLandmarks = results.poseLandmarks;
      analyzeLiveKinematics(results.poseLandmarks);
    }
    drawScene(results.poseLandmarks || lastLandmarks);
  }

  // 실시간 관절 변위 정밀 계측 함수
  function analyzeLiveKinematics(lm) {
    const W = canvas.width;
    const H = canvas.height;

    // 영상 초반 0.35초는 어드레스 자세 캡처
    if (video.currentTime < 0.35 && !addressLandmarks) {
      addressLandmarks = lm;
    }

    if (addressLandmarks) {
      // 1. 머리 변위 측정
      const initHead = { x: addressLandmarks[0].x * W, y: addressLandmarks[0].y * H };
      const curHead = { x: lm[0].x * W, y: lm[0].y * H };
      const dev = Math.hypot(curHead.x - initHead.x, curHead.y - initHead.y);
      if (dev > maxHeadDev) maxHeadDev = dev;

      // 2. 골반 전진(배치기) 측정
      const initHipY = (addressLandmarks[23].y + addressLandmarks[24].y) / 2 * H;
      const curHipY = (lm[23].y + lm[24].y) / 2 * H;
      const hipDev = Math.abs(curHipY - initHipY);
      if (hipDev > maxHipDev) maxHipDev = hipDev;

      // 3. 어깨 회전 턴
      const sDx = (lm[12].x - lm.x) * W;
      const sDy = (lm[12].y - lm.y) * H;
      const shoulderTurn = Math.abs(Math.round(Math.atan2(sDy, sDx) * (180 / Math.PI)));
      if (shoulderTurn > maxShoulderTurn) maxShoulderTurn = shoulderTurn;
    }

    // 손목 최하단 가속 지점 자동 감지
    const lw = lm[15];
    const rw = lm[16];
    if (lw && rw) {
      const wristY = (lw.y + rw.y) / 2;
      if (wristY > 0.78 && !hasTriggeredSlow && video.currentTime > (video.duration * 0.4)) {
        impactTime = video.currentTime;
      }
    }
  }

  function drawScene(lm) {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (lm) {
      drawConnectors(ctx, lm, POSE_CONNECTIONS, { color: 'rgba(255, 255, 255, 0.4)', lineWidth: 2 });
      drawLandmarks(ctx, lm, { color: '#10b981', fillColor: '#34d399', lineWidth: 1, radius: 3 });

      const midShoulder = { x: (lm.x + lm[12].x) / 2 * canvas.width, y: (lm.y + lm[12].y) / 2 * canvas.height };
      const midHip = { x: (lm[23].x + lm[24].x) / 2 * canvas.width, y: (lm[23].y + lm[24].y) / 2 * canvas.height };
      ctx.beginPath();
      ctx.moveTo(midShoulder.x, midShoulder.y);
      ctx.lineTo(midHip.x, midHip.y);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3.5;
      ctx.stroke();
    }

    if (isTracerActive && tracerProgress > 0.02) {
      drawNeonTracer();
    }
    ctx.restore();
  }

  function drawNeonTracer() {
    const W = canvas.width;
    const H = canvas.height;

    // 점수에 연동된 궤적 색상 및 휨 정도
    let color = '#10b981';
    let curveOffset = 0;

    if (shotTrajectoryType === 'slice') {
      color = '#ef4444'; // 빨간 슬라이스
      curveOffset = 0.25;
    } else if (shotTrajectoryType === 'fade') {
      color = '#f59e0b'; // 노란 페이드
      curveOffset = 0.10;
    } else {
      color = '#10b981'; // 초록 스트레이트
      curveOffset = 0;
    }

    const startX = W * 0.48;
    const startY = H * 0.88;
    const apexX = W * (0.50 + curveOffset * 0.6);
    const apexY = H * 0.28;
    const endX = W * (0.50 + curveOffset);
    const endY = H * 0.52;

    const steps = 50;
    const curSteps = Math.floor(steps * tracerProgress);

    function getPt(t) {
      const inv = 1 - t;
      return {
        x: inv * inv * startX + 2 * inv * t * apexX + t * t * endX,
        y: inv * inv * startY + 2 * inv * t * apexY + t * t * endY
      };
    }

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';

    ctx.beginPath();
    const p0 = getPt(0);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i <= curSteps; i++) {
      const pt = getPt(i / steps);
      ctx.lineWidth = Math.max(2, 5 * (1 - (i / steps) * 0.5));
      ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();

    const headPt = getPt(tracerProgress);
    ctx.beginPath();
    ctx.arc(headPt.x, headPt.y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    if (tracerProgress >= 0.95) {
      ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(endX - 35, endY - 45, 70, 22, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`${calculatedDist}m`, endX - 18, endY - 30);
    }
    ctx.restore();
  }
</script>

</body>
