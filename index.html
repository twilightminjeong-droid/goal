<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">
  <title>AI Golf Coach & Tracer</title>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.45);
      --cyan: #06b6d4;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 4px 0;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent); }
    header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 메인 뷰포트 */
    .viewport {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 9 / 14;
      max-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 초기 화면 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 20px;
      text-align: center;
    }
    .upload-btn-big {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #04101e;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 25px var(--accent-glow);
      transition: transform 0.15s;
    }
    .upload-btn-big:active { transform: scale(0.96); }
    input[type="file"] { display: none; }

    /* 분석 중 토스트 */
    .status-toast {
      position: absolute;
      top: 12px;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .status-toast .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 결과 리포트 카드 */
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 성별 토글 스위치 */
    .gender-selector {
      display: flex;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      align-self: center;
    }
    .g-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .g-btn.active {
      background: var(--accent);
      color: #04101e;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }
    .score-block { display: flex; flex-direction: column; }
    .score-block .label { font-size: 0.72rem; color: var(--text-sub); }
    .score-block .num { font-size: 2.2rem; font-weight: 900; color: var(--accent); line-height: 1.1; }

    .dist-block { text-align: right; }
    .dist-block .label { font-size: 0.72rem; color: var(--text-sub); }
    .dist-block .num { font-size: 1.8rem; font-weight: 800; color: var(--cyan); line-height: 1.1; }
    .dist-block .num span { font-size: 0.85rem; font-weight: 400; color: var(--text-sub); margin-left: 2px; }

    .coach-tip {
      background: rgba(16, 185, 129, 0.08);
      border-left: 4px solid var(--accent);
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .coach-tip strong { color: var(--accent); }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-action {
      flex: 1;
      padding: 12px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

      background: rgba(255
